version: "3.9"
services:
  api:
    image: myorg/api:latest
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s

  db:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s

  cache:
    image: redis:7
    # no healthcheck defined

  worker:
    image: myorg/worker:latest
    depends_on:
      - db
      - cache
